<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <base href="../">
    <title>Microgame visual checks</title>
    <style>html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#101925; } #game { width:100%; height:100%; } canvas { display:block; }</style>
</head>
<body>
<div id="game"></div>
<script src="phaser.js"></script>
<script type="module">
    import { Final } from './src/scenes/Final.js';
    import { GAMES } from './src/minigames/engineering.js';
    const addText = Phaser.GameObjects.GameObjectFactory.prototype.text;
    Phaser.GameObjects.GameObjectFactory.prototype.text = function(x,y,text,style={}) {
        const pad = Math.ceil(parseInt(style.fontSize ?? 16, 10) * 0.25);
        return addText.call(this,x,y,text,{...style,padding:{top:pad,bottom:pad}});
    };
    // Frozen rendering gallery: arrows cycle all 15 views; no save data changes.
    class Preview extends Final {
        create() {
            super.create();
            this.deck = GAMES.map(game => game.id);
            const requested = new URLSearchParams(location.search).get('game');
            this.roundIndex = Math.max(0, this.deck.indexOf(requested));
            this.showExample();
        }
        showExample() {
            this.hideOverlay();
            this.startRound();
            this.mode = 'playing';
            this.current.elapsed = 1;
            this.renderGame();
        }
        handleKey(event) {
            if(event.repeat) return;
            if(event.code === 'ArrowRight' || event.code === 'ArrowLeft') {
                this.roundIndex = (this.roundIndex + (event.code === 'ArrowRight' ? 1 : 14)) % 15;
                this.showExample();
            }
        }
        pause() {}
        update() {}
    }
    new Phaser.Game({ type: Phaser.AUTO, parent:'game', width:1280, height:720,
        scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Preview] });
</script>
</body>
</html>
